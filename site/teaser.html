<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Render del teaser · Yo, Emilia</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;background:#111;color:#ddd;font:14px/1.4 system-ui}canvas{display:block;width:100vw;height:auto}#log{position:fixed;left:8px;bottom:8px;background:#000a;padding:6px 10px;border-radius:6px}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas><div id="log">cargando…</div>
<script type="module">
// Teaser en movimiento a partir de la imagen generada con Gemini (img/teaser.jpg).
//   teaser.html          → vista previa en bucle
//   teaser.html?rec=1    → graba videos/teaser.mp4 (12 s, 1280×720, H.264)
const W = 1280, H = 720, FPS = 30, DUR = 12, N = FPS * DUR;
const c = document.getElementById('c'), x = c.getContext('2d');
const log = m => { document.getElementById('log').textContent = m; window.__status = m; };
const img = new Image(); img.src = 'img/teaser.jpg'; await img.decode();
const IW = img.naturalWidth, IH = img.naturalHeight;

/* polvo en la luz de la ventana (posiciones fijas con semilla para que el bucle sea estable) */
let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
const motes = Array.from({ length: 140 }, () => ({ x: 0.32 + r() * 0.6, y: 0.08 + r() * 0.8, z: 0.3 + r() * 0.9, ph: r() * 6.28, sp: 0.4 + r() }));
const ease = u => u * u * (3 - 2 * u);

function draw(f) {
  const u = f / N, e = ease(u);
  /* travelling hacia Emilia: 1.0 → 1.13, con un leve desplazamiento hacia la derecha */
  const z = 1.0 + 0.13 * e, cx = IW * (0.52 + 0.035 * e), cy = IH * (0.47 - 0.01 * e);
  const sw = IW / z, sh = sw * H / W;
  x.drawImage(img, cx - sw / 2, cy - sh / 2, sw, sh, 0, 0, W, H);
  /* respiración de la luz del atardecer */
  x.globalCompositeOperation = 'soft-light';
  const g = x.createRadialGradient(W * 0.66, H * 0.3, 20, W * 0.66, H * 0.3, W * 0.75);
  const k = 0.22 + 0.08 * Math.sin(u * Math.PI * 2);
  g.addColorStop(0, `rgba(255,186,110,${k})`); g.addColorStop(1, 'rgba(255,186,110,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  /* polvo flotando */
  x.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const px = (m.x + 0.025 * Math.sin(u * 6.28 * m.sp + m.ph)) * W, py = (m.y - 0.04 * u * m.sp + 0.012 * Math.cos(u * 12.56 + m.ph)) * H;
    const a = 0.10 + 0.22 * m.z * (0.5 + 0.5 * Math.sin(u * 6.28 * 2 + m.ph));
    x.fillStyle = `rgba(255,224,180,${a})`; x.beginPath(); x.arc(px, py, 0.6 + m.z * 1.4, 0, 6.29); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
  /* viñeta y grano */
  const v = x.createRadialGradient(W / 2, H * 0.48, H * 0.35, W / 2, H / 2, W * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(8,6,4,.62)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
  const id = x.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 11; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(id, 0, 0);
  /* fundido de entrada y salida para que el bucle no salte */
  const fade = Math.min(1, f / 18, (N - 1 - f) / 18);
  if (fade < 1) { x.fillStyle = `rgba(0,0,0,${1 - fade})`; x.fillRect(0, 0, W, H); }
}

const tick = () => new Promise(res => { const ch = new MessageChannel(); ch.port1.onmessage = () => res(); ch.port2.postMessage(0); });
if (new URLSearchParams(location.search).get('rec')) {
  try {
    const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.mjs');
    const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H }, fastStart: 'in-memory' });
    let err = null; const enc = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: e2 => { err = e2; } });
    enc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 2.6e6, framerate: FPS, latencyMode: 'quality' });
    for (let f = 0; f < N; f++) {
      draw(f); const vf = new VideoFrame(c, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: f % 60 === 0 }); vf.close();
      while (enc.encodeQueueSize > 6) await tick();
      if (f % 15 === 0) { log(`teaser: ${f}/${N}`); await tick(); }
      if (err) throw err;
    }
    await enc.flush(); muxer.finalize();
    const res = await fetch('/upload?name=teaser.mp4', { method: 'POST', body: muxer.target.buffer });
    log(`LISTO teaser.mp4 ${(muxer.target.buffer.byteLength / 1e6).toFixed(2)} MB (${res.status})`);
  } catch (e2) { log('ERROR ' + (e2 && e2.message || e2)); }
} else {
  let f = 0; const loop = () => { draw(f); f = (f + 1) % N; requestAnimationFrame(loop); }; loop(); log('vista previa');
}
</script>
</body>
</html>
